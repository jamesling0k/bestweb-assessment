name: bestweb-assessment

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bestweb
      MYSQL_USER: bestweb
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run the Docker setup command from README first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run the Docker setup command from README first}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-testing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --database=\"$${MYSQL_DATABASE}\" --execute='SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-BestWeb Products}
      APP_ENV: local
      APP_KEY: ${APP_KEY:?Run the Docker setup command from README first}
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: bestweb
      DB_USERNAME: bestweb
      DB_PASSWORD: ${DB_PASSWORD:?Run the Docker setup command from README first}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      ADMIN_NAME: ${ADMIN_NAME:-Assessment Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run the Docker setup command from README first}
    volumes:
      - .:/var/www/html
      - composer-cache:/tmp/composer-cache
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 600s

volumes:
  mysql-data:
  composer-cache:
